[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-phenotyper"
version = "0.1.0"
description = "Cell phenotyping with ensemble voting for multiplexed immunofluorescence data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Willie Wu"}
]
dependencies = [
    "iris-common",              # workspace sibling
    "napari[all]>=0.4.18",
    "numpy",
    "scipy",
    "pandas",
    "scikit-image",
    "matplotlib",
    "tifffile",
    "qtpy",
    "dask[array]",
    "anndata>=0.9",
    "scanpy>=1.9",
    "umap-learn>=0.5",
    "pyqtgraph>=0.13",          # for live training loss curves
]

[project.optional-dependencies]
astir    = ["astir"]
celesta  = []                   # GitHub-only: pip install git+https://github.com/plevritis-lab/CELESTA.git
stellar  = ["torch>=2.0", "torch-geometric"]
dev      = ["pytest>=7.0", "pytest-qt>=4.0"]

[project.scripts]
iris-phenotyper = "iris_phenotyper.main:main"

[tool.setuptools.packages.find]
where = ["src"]
