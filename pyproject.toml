[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-viewer"
version = "0.1.0"
description = "A production-quality Python application for multiplexed immunofluorescence imaging"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Willie Wu"}
]
dependencies = [
    "napari[all]>=0.4.18",
    "numpy",
    "scipy",
    "pandas",
    "scikit-image",
    "matplotlib",
    "tifffile",
    "qtpy",
]

[project.optional-dependencies]
cellpose = ["cellpose>=3.0"]
stardist = ["stardist", "csbdeep"]
instanseg = ["instanseg"]
cellsam = ["cellSAM"] # Place-holder for custom or real CellSAM
all = ["cellpose", "stardist", "instanseg", "cellSAM"]
dev = [
    "pytest",
    "pytest-qt"
]

[project.scripts]
iris-viewer = "iris_viewer.main:main"
