[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-viewer"
version = "0.2.0"
description = "IRIS-Viewer: Interactive Spatial Proteomics, Multiplexed Imaging, Single-Cell Phenotyping & Microenvironment Analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Willie Wu"}
]
dependencies = [
    # Core
    "napari[all]>=0.4.18",
    "numpy",
    "scipy",
    "pandas",
    "scikit-image",
    "matplotlib",
    "tifffile",
    "qtpy",
    "dask[array]",
    "openpyxl",
    
    # Phenotyping & single-cell analysis
    "anndata>=0.9",
    "scanpy>=1.9",
    "umap-learn>=0.5",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
# Segmentation Extras
cellpose   = ["cellpose>=3.0"]
stardist   = ["stardist", "csbdeep"]

# Deep Learning Phenotyping Extras
astir      = ["astir"]
maps       = ["torch>=2.0", "torch-geometric"]

# Master Extras
all        = ["cellpose>=3.0", "stardist", "csbdeep", "astir", "torch>=2.0", "torch-geometric"]
dev        = ["pytest>=7.0", "pytest-qt>=4.0"]

[project.scripts]
iris-viewer = "iris_viewer.main:main"

[tool.setuptools.packages.find]
where = ["src"]

# Shared dev dependencies
[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
    "mypy>=1.0",
    "ruff>=0.4",
    "coverage[toml]>=7.0",
]

# Tool config
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]
ignore = ["E741", "E722", "E402", "E701"]

[tool.ruff.lint.isort]
known-first-party = ["iris_viewer"]

