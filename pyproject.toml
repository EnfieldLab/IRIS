[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-viewer"
version = "0.2.0"
description = "IRIS: Interactive Research viewer for Integrated Spatial-omics (Viewer, Phenotyper & Analyzer)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Willie Wu"}
]
dependencies = [
    # Core
    "napari[all]>=0.4.18",
    "numpy",
    "scipy",
    "pandas",
    "scikit-image",
    "scikit-learn",
    "matplotlib",
    "tifffile",
    "qtpy",
    "dask[array]",
    "openpyxl",

    # Phenotyping & single-cell analysis
    "anndata>=0.9",
    "scanpy>=1.9",
    "umap-learn>=0.5",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
# Segmentation Extras
cellpose   = ["cellpose>=3.0"]
stardist   = ["stardist", "csbdeep"]
instanseg  = ["instanseg-torch", "torch>=2.0"]

# Phenotyping & Spatial Extras
astir      = ["astir", "torch>=2.0"]
maps       = ["torch>=2.0"]
stellar    = ["torch>=2.0", "torch-geometric"]
nimbus     = ["nimbus-inference", "torch>=2.0"]
spatial    = ["squidpy>=1.3", "scipy", "scikit-learn"]

# Master Extras
all = [
    "cellpose>=3.0",
    "stardist",
    "csbdeep",
    "instanseg-torch",
    "astir",
    "torch>=2.0",
    "torch-geometric",
    "nimbus-inference",
    "squidpy>=1.3",
]
dev = ["pytest>=7.0", "pytest-qt>=4.0"]

[project.scripts]
iris = "iris_viewer.main:main"
iris-viewer = "iris_viewer.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["iris_common*", "iris_viewer*", "iris_phenotyper*", "iris_analyzer*"]
exclude = ["*doi_*"]

# Shared dev dependencies
[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
    "mypy>=1.0",
    "ruff>=0.4",
    "coverage[toml]>=7.0",
]

# Tool config
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]
ignore = ["E741", "E722", "E402", "E701"]

[tool.ruff.lint.isort]
known-first-party = ["iris_common", "iris_viewer", "iris_phenotyper", "iris_analyzer"]
