[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-suite"
version = "0.2.0"
description = "IRIS Suite: Viewer, Phenotyper, and Analyzer for multiplexed immunofluorescence imaging"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Willie Wu"}
]
dependencies = [
    # Core
    "napari[all]>=0.4.18",
    "numpy",
    "scipy",
    "pandas",
    "scikit-image",
    "matplotlib",
    "tifffile",
    "qtpy",
    "dask[array]",
    
    # Phenotyper specific
    "anndata>=0.9",
    "scanpy>=1.9",
    "umap-learn>=0.5",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
# Viewer Extras
cellpose   = ["cellpose>=3.0"]
stardist   = ["stardist", "csbdeep"]

# Phenotyper Extras
astir      = ["astir"]
celesta    = [] # GitHub-only: pip install git+https://github.com/plevritis-lab/CELESTA.git
stellar    = ["torch>=2.0", "torch-geometric"]

# Master Extras
all        = ["cellpose>=3.0", "stardist", "csbdeep", "astir", "torch>=2.0", "torch-geometric"]
dev        = ["pytest>=7.0", "pytest-qt>=4.0"]

[project.scripts]
iris-viewer = "iris_viewer.main:main"
iris-phenotyper = "iris_phenotyper.main:main"

[tool.setuptools.packages.find]
where = ["src"]

# ── Shared dev dependencies ───────────────────────────────────────────────────
[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
    "mypy>=1.0",
    "ruff>=0.4",
    "coverage[toml]>=7.0",
]

# ── Tool config ───────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
